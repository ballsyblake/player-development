<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Development Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%232a78d6%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">PD</span>
        <div>
          <div class="brand-name">Player Development</div>
          <div class="brand-sub" id="season-label"></div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-view="dashboard">Dashboard</a>
        <a href="#/players" data-view="players">Players</a>
        <a href="#/squads" data-view="squads">Squads</a>
        <a href="#/kit" data-view="kit">Kit orders</a>
        <a href="#/quality" data-view="quality">Data quality <span class="nav-badge" id="issue-count"></span></a>
        <a href="#/data" data-view="data">Import / export</a>
        <a href="#/settings" data-view="settings">Settings</a>
      </nav>
      <div class="nav-section">Programs</div>
      <nav class="nav nav-programs" id="program-nav"></nav>
      <div class="storage-note" id="storage-note"></div>
    </aside>
    <div class="content">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">&#9776;</button>
        <h1 id="view-title">Dashboard</h1>
        <div class="topbar-actions">
          <input type="search" id="global-search" placeholder="Search players, parents, emails..." aria-label="Search">
          <button class="btn primary" id="add-player">Add player</button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Player details"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/model.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
